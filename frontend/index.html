<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre l'arabe classique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-blobs" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-emoji">🐫</span>
      <span class="brand-ar">تَعَلَّمِ العَرَبِيَّةَ</span>
      <span class="brand-fr">Apprendre l'arabe classique</span>
    </div>
    <nav class="tabs" id="main-nav">
      <button data-route="accueil" class="tab-btn active">🏠 Accueil</button>
      <button data-route="phase1" class="tab-btn">🔤 Phase 1</button>
      <button data-route="phase2" class="tab-btn">✍️ Phase 2</button>
      <button data-route="phase3" class="tab-btn">📚 Phase 3</button>
      <button data-route="phase4" class="tab-btn">🌟 Phase 4</button>
      <button data-route="programme" class="tab-btn">🗺️ Programme</button>
    </nav>
  </header>

  <main id="view-root" class="view-root">
    <p class="loading">Chargement…</p>
  </main>

  <footer class="app-footer">
    Programme d'apprentissage — Arabe classique · en route vers les 4 phases ! 🚀
  </footer>
</div>

<div id="letter-modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="letter-modal-close" aria-label="Fermer">×</button>
    <div id="letter-modal-body"></div>
  </div>
</div>

<div id="mascot" class="mascot">
  <div class="mascot-bubble" id="mascot-bubble">Salut ! Prêt à apprendre l'arabe avec moi ? 🎉</div>
  <button class="mascot-face" id="mascot-face" aria-label="Mascotte Sami le chameau">🐫</button>
</div>

<script src="app.js"></script>
</body>
</html>
